name: check-copilot
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: copilot-instructions.md is generated from current sources
        run: python scripts/build_copilot.py --check
      - name: Skill MCP references are generated from the shared contract
        run: python scripts/sync_skill_refs.py --check
      - name: Test Copilot payload mirroring
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build the Release Evidence Reviewer template
        run: dotnet build skills/build-template-agent/assets/release-evidence-reviewer/ReleaseEvidenceReviewer.csproj --configuration Release
      - name: Test the custom-agent helpers
        run: dotnet run --file skills/build-custom-agent/tests/helper-tests.cs
      - name: Copy, validate, and build the custom-agent starter
        run: |
          custom_agent_target="$RUNNER_TEMP/custom-agent-starter"
          dotnet run --file skills/build-custom-agent/scripts/copy-template.cs -- --target "$custom_agent_target"
          dotnet run --file skills/build-custom-agent/scripts/validate-project.cs -- --target "$custom_agent_target"
          dotnet build "$custom_agent_target/CustomAgent.csproj" --configuration Release

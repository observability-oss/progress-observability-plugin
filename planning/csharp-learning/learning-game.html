dynamic.","why":"var is compile-time inference. dynamic is a different, explicit C# feature."}],"answer":1,"hint":"The first assignment fixes the inferred type.","explanation":"The compiler rejects assigning a string to an int before this program can run.","code":"var apples = 3;\napples = \"three\";\nConsole.WriteLine(apples);"},{"id":"q01b","type":"choice","prompt":"What type does the compiler infer for basket?","options":[{"text":"int[]","why":"Correct. new[] creates an array and infers the element type int from these values."},{"text":"List\u003cint>","why":"A List\u003cint> is a growable collection. new[] specifically creates an array."},{"text":"A tuple of three values","why":"Tuples use parentheses, such as (1, 2, 3), and are a different type."}],"answer":0,"hint":"The square brackets after new are the clue.","explanation":"new[] infers the element type. The resulting int[] has a fixed length of three.","code":"var basket = new[] { 1, 2, 3 };"},{"id":"q01c","type":"fill","prompt":"Fill one operator so both conditions must be true.","code":"var count = 2;\nif (count > 0 ___ count \u003c 4)\n    Console.WriteLine(\"small\");","accepted":["&&"],"hint":"Use C# logical AND, which skips the right side when the left side is false.","explanation":"&& is logical AND. The right condition is evaluated only when the left condition is true."},{"id":"q01d","type":"order","prompt":"Arrange these lines into a program that prints 4.","lines":["var apples = 2;","var doubled = apples * 2;","Console.WriteLine(doubled);"],"hint":"Each name must be declared before the line that uses it.","explanation":"The second line needs apples; the final line needs doubled. These data dependencies determine the order."}],"reference":[{"term":"A tiny project file","meaning":"\u003cProject Sdk=\"Microsoft.NET.Sdk\">\u003cPropertyGroup>\u003cOutputType>Exe\u003c/OutputType>\u003cTargetFramework>net10.0\u003c/TargetFramework>\u003cNullable>enable\u003c/Nullable>\u003c/PropertyGroup>\u003c/Project> defines an executable project. Web projects use Microsoft.NET.Sdk.Web."},{"term":"C# 14 and .NET 10","meaning":"These are the lesson targets. C# is versioned separately from .NET, and many demonstrated features existed before C# 14."},{"term":"Entry-point shape","meaning":"static void Main() is an explicit entry method inside a type. Alternatively, top-level statements appear before type declarations; only one project source file may contain top-level statements."},{"term":"File-based app","meaning":"With .NET 10, dotnet run --file hello.cs builds and runs a standalone C# source file. The generated agents use projects; some development helpers can be file-based apps."},{"term":"Namespace","meaning":"namespace Pantry; groups type names logically. A namespace need not equal a folder, though matching them often helps readers."},{"term":"using as an import","meaning":"using System; lets you write Console instead of System.Console. It neither copies source nor installs a package. using for disposal is a separate syntax."},{"term":"Explicit typing and literals","meaning":"int count = 2; bool ready = true; string name = \"Ada\"; use explicit types. C# uses semicolons and braces; // starts a line comment."},{"term":"while, continue and break","meaning":"while (count > 0) repeats while a condition stays true. continue skips to the next loop iteration; break exits the nearest loop. Make progress toward a stopping condition."}]},{"id":"02-functions","title":"Functions, methods and little helpers","subtitle":"Start with inputs and outputs; introduce objects only when needed.","conceptIds":["methods","lambdas","local-functions","argument-modifiers","recursion"],"rules":["Read int Double(int number) as: returns int, named Double, accepts one int. void means no return value.","A static method belongs to its type; an instance method uses an object. A local function belongs inside another body.","Overloads share a name but differ in parameters. An override replaces an inherited virtual or abstract implementation.","number => number + extra is a lambda. Func\u003cint, int> describes input and output types; captures can observe later changes.","out supplies an output; ref accesses an initialized caller variable; params accepts several arguments. Recursion needs a stopping case."],"code":"var extra = 2;\nFunc\u003cint, int> addExtra = number => number + extra;\nConsole.WriteLine(addExtra(3));\nextra = 4;\nConsole.WriteLine(addExtra(3));\nstatic int Double(int number) => number * 2;\nConsole.WriteLine(Double(3));","python":"extra = 2\nadd_extra = lambda number: number + extra\nprint(add_extra(3))\nextra = 4\nprint(add_extra(3))\ndef double(number):\n    return number * 2\nprint(double(3))","pythonNote":"Both examples observe the later extra value. C# also checks the delegate signature; local functions can capture unless static.","trap":"The arrow can introduce a lambda or an expression-bodied member. Neither makes the computation asynchronous.","agentConnection":"Tool handlers are methods; routing and LINQ use lambdas. Small helpers can stay functions without new class hierarchies.","questions":[{"id":"q02a","type":"choice","prompt":"What does the second Console.WriteLine print?","options":[{"text":"5","why":"That is the first call. The lambda captured the variable, not a frozen copy of its original value."},{"text":"7","why":"Correct. extra is now 4, so addExtra(3) computes 3 + 4."},{"text":"It fails because captured variables cannot change.","why":"This captured local is mutable. A capture does not make it readonly."}],"answer":1,"hint":"Read the current value of extra when the lambda runs.","explanation":"The lambda reads the same captured variable on both calls; assigning 4 changes what the later call reads.","code":"var extra = 2;\nFunc\u003cint, int> addExtra = number => number + extra;\nConsole.WriteLine(addExtra(3));\nextra = 4;\nConsole.WriteLine(addExtra(3));\nstatic int Double(int number) => number * 2;\nConsole.WriteLine(Double(3));"},{"id":"q02b","type":"choice","prompt":"What language feature is this pair of methods?","options":[{"text":"Overriding","why":"An override requires an inherited virtual or abstract member, and uses override."},{"text":"Overloading","why":"Correct. The methods share a name but accept different parameter types."},{"text":"Recursion","why":"Recursion happens when a function calls itself. Neither of these methods does."}],"answer":1,"hint":"Compare the parameter lists, not just the shared name.","explanation":"Overload selection uses the call arguments. string Repeat(string text) and int Repeat(int number) have distinct signatures.","code":"static class Repeater\n{\n    public static string Repeat(string text) => text + text;\n    public static int Repeat(int number) => number * 2;\n}"},{"id":"q02c","type":"fill","prompt":"Fill one keyword so TryParse can assign its parsed result.","code":"bool ok = int.TryParse(\"12\", ___ var count);\nConsole.WriteLine(ok ? count : 0);","accepted":["out"],"hint":"The method writes a result into this caller variable.","explanation":"out marks an output argument. TryParse assigns it and separately returns a bool indicating success; ref would require an initialized variable."},{"id":"q02d","type":"choice","prompt":"What does Total(3) return?","options":[{"text":"3","why":"The function adds n to a smaller recursive result; it does not return only the first n."},{"text":"6","why":"Correct. Total(3) is 3 + 2 + 1 + 0. n == 0 is the stopping case."},{"text":"It never stops.","why":"For this positive input, each call decreases n until it reaches zero."}],"answer":1,"hint":"Expand one call at a time until n reaches zero.","explanation":"The recursive calls return in reverse order: 0, then 1, then 3, then 6. This version is intended for nonnegative inputs.","code":"static int Total(int n) => n == 0 ? 0 : n + Total(n - 1);\nConsole.WriteLine(Total(3));"}],"reference":[{"term":"Return versus output","meaning":"return value; sends a value back to the caller. Console.WriteLine(value) displays it. void means the function has no return value."},{"term":"A method in a class","meaning":"public static int Double(int number) { return number * 2; } is called as Helpers.Double(3) when declared in Helpers. Its expression-bodied equivalent ends with => number * 2;."},{"term":"Instance method","meaning":"jar.Add(3) acts on jar. Inside an ordinary instance method, this denotes that current object; a static method has no this."},{"term":"Local function","meaning":"A helper declared inside a method or top-level body can use surrounding locals. Add static to forbid capturing surrounding instance or local state."},{"term":"Lambda and delegate","meaning":"Func\u003cint, int> accepts an int and returns an int. Action\u003cint> accepts an int and returns void. A lambda supplies a callable value; => also appears in expression-bodied members."},{"term":"out","meaning":"int.TryParse(text, out var number) assigns number and returns a success bool. The caller does not have to initialize an out argument."},{"term":"ref","meaning":"void Increment(ref int value) { value++; } can change a caller variable. Initialize int n = 2; then call Increment(ref n). Ordinary reference-type arguments already pass an object reference by value; ref is not needed to mutate that object."},{"term":"params","meaning":"static int Count(params int[] numbers) => numbers.Length; accepts Count(1, 2, 3) or Count(new[] { 1, 2, 3 }). params makes the last parameter accept a variable number of arguments."},{"term":"Recursion","meaning":"A recursive helper calls itself on a smaller subproblem. A stopping case prevents endless calls; recursion is useful for nested structures, not a requirement for ordinary loops."},{"term":"nameof","meaning":"nameof(Double) produces the string \"Double\" at compile time when that symbol is in scope. It names the symbol without calling the function or reading its value."}]},{"id":"03-null","title":"Missing values without guessing","subtitle":"A compiler warning helps; runtime checks still matter.","conceptIds":["nullable","patterns","expressions"],"rules":["null means absent, not empty text or zero. string? marks a nullable reference; int? can hold an integer or null.","\u003cNullable>enable\u003c/Nullable> enables reference annotations and compiler analysis. An annotation does not validate runtime input.","value?.Member accesses only when non-null; value ?? fallback uses the fallback only when value is null.","value! suppresses a compiler warning; it performs no runtime check. Prefer proving a value exists before using it.","is matches patterns: is null, is not null, or is \"red\" or \"blue\". && evaluates the right side only if needed."],"code":"string? nickname = null;\nstring display = nickname ?? \"Guest\";\nConsole.WriteLine(display);\nConsole.WriteLine(nickname?.Length ?? 0);\nnickname = \"Ada\";\nif (nickname is not null && nickname.Length > 2)\n    Console.WriteLine(\"long enough\");","python":"nickname = None\ndisplay = nickname if nickname is not None else \"Guest\"\nprint(display)\nprint(len(nickname) if nickname is not None else 0)\nnickname = \"Ada\"\nif nickname is not None and len(nickname) > 2:\n    print(\"long enough\")","pythonNote":"Do not translate ?? as Python or: or also replaces empty strings, zero and other falsy values.","trap":"name!.Length still throws if name is null. The exclamation mark changes compiler analysis, not the object.","agentConnection":"Optional configuration and request properties need explicit defaults or validation before handlers dereference them.","questions":[{"id":"q03a","type":"choice","prompt":"What does this print?","options":[{"text":"[]","why":"Correct. Empty text is a present string, so ?? keeps it."},{"text":"[Guest]","why":"?? replaces only null. It does not replace an empty string."},{"text":"It throws.","why":"The left side is a valid string, and interpolation can print it."}],"answer":0,"hint":"Ask whether name is absent or merely empty.","explanation":"The fallback is skipped because name is not null. This differs from Python name or \"Guest\".","code":"string? name = \"\";\nConsole.WriteLine($\"[{name ?? \"Guest\"}]\");"},{"id":"q03b","type":"fill","prompt":"Fill one operator to access Length only when name is non-null.","code":"string? name = null;\nConsole.WriteLine(name___Length ?? 0);","accepted":["?."],"hint":"This operator combines a null check with member access.","explanation":"?. returns null here without accessing Length. ?? then supplies zero."},{"id":"q03c","type":"choice","prompt":"Does this safely check whether name is long?","options":[{"text":"Yes; ! converts null into an empty string.","why":"! does not convert values or supply defaults."},{"text":"No; ! suppresses a warning, and the access throws.","why":"Correct. Runtime null remains null, so accessing Length throws NullReferenceException."},{"text":"No; string? prevents the code from compiling.","why":"Nullable annotations enable warnings, not a blanket ban on dereferencing."}],"answer":1,"hint":"The null-forgiving operator has no runtime effect.","explanation":"Use name is not null && name.Length > 3, or a suitable null-conditional expression, when absence is expected.","code":"string? name = null;\nbool isLong = name!.Length > 3;"},{"id":"q03d","type":"choice","prompt":"What does this print?","options":[{"text":"False","why":"Correct. The first condition is false, so && skips the Length access."},{"text":"True","why":"The first condition is false because color is null."},{"text":"It throws while reading Length.","why":"Short-circuit && skips its right side when the left side is false."}],"answer":0,"hint":"Evaluate only the left condition first.","explanation":"The is not null pattern proves a value exists on the path where the right-hand expression runs.","code":"string? color = null;\nConsole.WriteLine(color is not null && color.Length > 3);"}],"reference":[{"term":"Nullable reference versus nullable value","meaning":"string? and string use the same runtime reference type; ? enables compiler analysis. int? is Nullable\u003cint>, a value type that represents an integer or no value."},{"term":"Conditional expression","meaning":"condition ? whenTrue : whenFalse selects one result. It is different from the nullable annotation in string? and the null-conditional operator ?. ."},{"term":"Value patterns","meaning":"color is \"red\" or \"blue\" accepts either text value. count is >= 1 and \u003c= 3 combines relational patterns; or/and here are pattern combinators, not ||/&& operators."},{"term":"Pattern captures","meaning":"if (value is string text) proves value is a string and introduces text for the matching path. A property pattern can inspect shape: value is { Length: > 2 }."},{"term":"Null-safe length test","meaning":"name is not null && name.Length > 3 checks existence before accessing Length. Merely writing name! does not check anything at runtime."},{"term":"Assign a null fallback","meaning":"name ??= \"Guest\" assigns \"Guest\" only if name is currently null. name ?? \"Guest\" merely produces a fallback value without assigning it to name."}]},{"id":"04-objects","title":"An object is data with useful operations","subtitle":"A class defines the shape; new creates one instance.","conceptIds":["classes","primary-constructors","fields","access","initializers"],"rules":["A class is a type; new Jar(2) creates an instance. A constructor initializes each new object.","A field stores state. A property provides access; get reads, set assigns, and init restricts assignment to initialization.","Class primary-constructor parameters are inputs, not automatic public properties. Declare properties explicitly when callers need them.","public exposes; private confines to the type; internal confines to the assembly. static belongs to the type; sealed forbids subclassing.","readonly fields cannot be reassigned after their allowed initialization. Referenced objects may still mutate. Object initializers run after construction."],"code":"var jar = new Jar(2) { Label = \"Rice\" };\njar.Add(3);\nConsole.WriteLine($\"{jar.Label}: {jar.Count}\");\nsealed class Jar(int start)\n{\n    private int count = start;\n    public string Label { get; init; } = \"Plain\";\n    public int Count => count;\n    public void Add(int amount) => count += amount;\n}","python":"class Jar:\n    def __init__(self, start):\n        self._count = start\n        self.label = \"Plain\"\n    @property\n    def count(self):\n        return self._count\n    def add(self, amount):\n        self._count += amount\njar = Jar(2)\njar.label = \"Rice\"\njar.add(3)\nprint(f\"{jar.label}: {jar.count}\")","pythonNote":"Python _count is a convention, unlike C# private. This Python label also lacks the C# init-only restriction.","trap":"A primary constructor is shorter syntax for accepting construction inputs, not a second object or an automatic public API.","agentConnection":"Stores and tool handlers keep state in fields and expose deliberate methods/properties; their constructors receive dependencies.","questions":[{"id":"q04a","type":"choice","prompt":"After these lines, what does first.Count print?","options":[{"text":"2","why":"second is not a copied Jar; both variables refer to the same object."},{"text":"5","why":"Correct. Assigning a class reference gives both variables access to the same Jar."},{"text":"It fails because Jar is sealed.","why":"sealed blocks subclasses; it does not prevent creating or mutating instances."}],"answer":1,"hint":"Count how many times new Jar appears.","explanation":"There is one Jar and two references. second.Add changes the object that first also refers to.","code":"var first = new Jar(2);\nvar second = first;\nsecond.Add(3);\nConsole.WriteLine(first.Count);\nsealed class Jar(int start)\n{\n    private int count = start;\n    public int Count => count;\n    public void Add(int amount) => count += amount;\n}"},{"id":"q04b","type":"choice","prompt":"With this complete class, can a caller read jar.start?","options":[{"text":"Yes; every primary parameter becomes a public property.","why":"That property synthesis applies to positional records, not an ordinary class."},{"text":"No; start is a constructor parameter, not a public member.","why":"Correct. The class accepts start, but exposes no public property named start."},{"text":"Yes; sealed makes fields public.","why":"sealed only prevents inheritance; it does not change accessibility."}],"answer":1,"hint":"This is a class declaration without record.","explanation":"Add public int Start { get; } = start; if callers need a property. Parameters and properties are different structures.","code":"sealed class Jar(int start)\n{\n    private int count = start;\n}"},{"id":"q04c","type":"fill","prompt":"Fill one property accessor so assignment is allowed during initialization, but not later.","code":"sealed class Jar\n{\n    public string Label { get; ___; } = \"Plain\";\n}","accepted":["init"],"hint":"It is the initialization-only alternative to set.","explanation":"init permits new Jar { Label = \"Rice\" }. It does not permit jar.Label = \"Beans\" in an ordinary later statement."},{"id":"q04d","type":"order","prompt":"Using this Jar type, arrange the statements to create a jar, add three, then print the updated count.","lines":["var jar = new Jar(2);","jar.Add(3);","Console.WriteLine(jar.Count);"],"hint":"Construction must precede using the object; print after its change.","explanation":"The constructor sets count to 2. Add changes it to 5. The final property read observes that updated state.","code":"sealed class Jar(int start)\n{\n    private int count = start;\n    public int Count => count;\n    public void Add(int amount) => count += amount;\n}"}],"reference":[{"term":"Ordinary constructor","meaning":"class Jar { private int count; public Jar(int start) { count = start; } } spells out construction explicitly. Constructors use the type name and have no declared return type."},{"term":"Primary-constructor equivalent","meaning":"class Jar(int start) { private int count = start; } accepts the same input more concisely. start is a parameter, not a public property; it can be used within the type body."},{"term":"Field versus property","meaning":"private int count; is storage. public int Count => count; is a getter exposing that storage. public string Label { get; set; } is an auto-property with compiler-provided storage."},{"term":"Initializer timing","meaning":"new Jar(2) { Label = \"Rice\" } constructs the object first, then assigns Label during initialization. required demands initialization by the caller; it does not validate the supplied value."},{"term":"readonly is shallow","meaning":"A readonly List\u003cint> field cannot normally be reassigned outside field initialization or its declaring constructor, but its existing list can still Add elements."},{"term":"Shared static state","meaning":"A static field belongs to the type rather than one instance. Every instance can observe shared state through it; do not use it merely to avoid constructing an object."},{"term":"Accessibility and assembly","meaning":"An assembly is a compiled .dll or .exe unit. internal restricts ordinary access to that assembly; private restricts access to the declaring type, not the entire source file."},{"term":"const versus readonly","meaning":"const int Limit = 5; declares a compile-time constant. A readonly field can instead be initialized at runtime during construction; neither keyword makes a referenced object deeply immutable."},{"term":"protected","meaning":"A protected member is accessible within its declaring class and derived classes, subject to C# receiver rules. It is useful for base-class helpers; it is not publicly callable by any object."}]},{"id":"05-records","title":"Data shapes and copies","subtitle":"Choose a simple shape; know what copying really copies.","conceptIds":["records","with","tuples"],"rules":["Class variables hold references; assigning one copies the reference. Struct assignment copies its value, including any references inside it.","record means record class unless struct is stated. Records generate value-based equality using their members’ equality rules.","Positional record-class parameters generate public init properties and deconstruction. Ordinary class primary parameters do not.","with copies a record and changes selected members. Nested reference objects remain shared: the copy is shallow.","Tuples group a few values: (string Name, int Count). Deconstruction, var (name, count), puts the components into local variables."],"code":"var first = new Label(\"Blue\", 2);\nvar same = new Label(\"Blue\", 2);\nvar changed = first with { Size = 3 };\nConsole.WriteLine(first == same);\nConsole.WriteLine($\"{first.Size}/{changed.Size}\");\nvar (color, size) = changed;\nConsole.WriteLine($\"{color}: {size}\");\nrecord Label(string Color, int Size);","python":"from dataclasses import dataclass, replace\n@dataclass(frozen=True)\nclass Label:\n    color: str\n    size: int\nfirst = Label(\"Blue\", 2)\nsame = Label(\"Blue\", 2)\nchanged = replace(first, size=3)\nprint(first == same)\nprint(f\"{first.size}/{changed.size}\")","pythonNote":"A frozen dataclass is a useful analogy, not an exact equivalent. It does not automatically support C# record-style deconstruction.","trap":"Records are not deeply immutable. A record containing List\u003cstring> can share a mutable list, and list equality is not element equality.","agentConnection":"Agent request/result records give data a clear shape. Readonly properties and with copies do not freeze nested lists.","questions":[{"id":"q05a","type":"choice","prompt":"What does this print?","options":[{"text":"True","why":"Correct. These Label records have the same type and equal Color and Size members."},{"text":"False","why":"Separate record instances can be equal because record equality compares their members."},{"text":"It fails because == cannot compare records.","why":"The compiler generates equality operators for records."}],"answer":0,"hint":"The declaration says record, not ordinary class.","explanation":"The generated equality compares member values here: strings compare their text, and integers compare their numeric value.","code":"Console.WriteLine(new Label(\"Blue\", 2) == new Label(\"Blue\", 2));\nrecord Label(string Color, int Size);"},{"id":"q05b","type":"choice","prompt":"What does this print after adding to the copy’s list?","options":[{"text":"1","why":"with copied the record, not the nested List object. Both records still refer to the same list."},{"text":"2","why":"Correct. The shallow copy shares Items, so adding through copy changes the list original also holds."},{"text":"It fails because records cannot contain mutable lists.","why":"A record may hold a mutable collection. init-only prevents property reassignment, not changes inside that list."}],"answer":1,"hint":"Ask whether with also creates a new List here.","explanation":"The record objects differ, but their Items references point to the same list. Copy the list explicitly when independent contents are required.","code":"var original = new Bag(new List\u003cstring> { \"pear\" });\nvar copy = original with { };\ncopy.Items.Add(\"plum\");\nConsole.WriteLine(original.Items.Count);\nrecord Bag(List\u003cstring> Items);"},{"id":"q05c","type":"fill","prompt":"Fill one keyword to make a modified record copy.","code":"var first = new Label(\"Blue\", 2);\nvar changed = first ___ { Size = 3 };\nrecord Label(string Color, int Size);","accepted":["with"],"hint":"This expression starts from the original record’s members.","explanation":"with creates the modified copy. first.Size remains 2; changed.Size becomes 3."},{"id":"q05d","type":"choice","prompt":"What does this print?","options":[{"text":"2/5","why":"Correct. Pair is a struct, so assigning a copies its value. Updating b.Count does not change a.Count."},{"text":"5/5","why":"That would be the result for this mutable shape declared as a class; here it is a value type."},{"text":"2/2","why":"b is mutable; changing its Count field succeeds and updates its own copy."}],"answer":0,"hint":"Find the struct keyword in the declaration.","explanation":"Value-type assignment copies the value. This example contains only an int; a struct can still contain references to shared objects.","code":"var a = new Pair { Count = 2 };\nvar b = a;\nb.Count = 5;\nConsole.WriteLine($\"{a.Count}/{b.Count}\");\nstruct Pair { public int Count; }"}],"reference":[{"term":"record class versus record struct","meaning":"record Label(string Color, int Size) is a reference type with generated init properties. record struct Label(...) is a value type whose generated positional properties are normally mutable; readonly record struct makes them init-only."},{"term":"Nested collection equality","meaning":"Two records containing separate List\u003cint> objects with equal elements are not automatically equal: each list normally uses reference equality. Records use the members’ own equality rules."},{"term":"Tuple deconstruction","meaning":"var snack = (Name: \"Pear\", Count: 2); var (name, count) = snack; creates local variables. Tuple labels aid readability; a tuple is not an interchangeable instance of a named record."},{"term":"A with copy is shallow","meaning":"A copied record gets copied member values. Reference-valued members still point at the original nested objects unless explicitly replaced with fresh copies."},{"term":"Anonymous object","meaning":"var snack = new { Name = \"Pear\", Count = 2 }; creates a compiler-generated type with read-only properties. new Jar { Label = \"Rice\" } instead initializes an existing named type. Both remain shallow with respect to referenced values."}]},{"id":"06-contracts","title":"Compose objects through small contracts","subtitle":"An interface says what is available; an object does the work.","conceptIds":["interfaces","injection","classes"],"rules":["An interface is a contract. IText inner accepts an existing implementing object; that parameter does not declare inheritance.","class PlainText : IText implements an interface. class Child : Parent inherits a base class: Child is a Parent.","A constructor dependency expresses has-a: Brackets has an IText. Passing it manually is dependency injection; a container is optional.","A decorator keeps the same contract, adds behavior, and forwards calls. virtual enables override; base accesses inherited behavior.","sealed blocks subclasses; sealed override blocks further overriding of that member. Keep simple transformations as functions when state is unnecessary."],"code":"IText source = new PlainText();\nIText decorated = new Brackets(source);\nConsole.WriteLine(decorated.Read());\ninterface IText { string Read(); }\nsealed class PlainText : IText\n{\n    public string Read() => \"hello\";\n}\nsealed class Brackets(IText inner) : IText\n{\n    public string Read() => $\"[{inner.Read()}]\";\n}","python":"class PlainText:\n    def read(self):\n        return \"hello\"\nclass Brackets:\n    def __init__(self, inner):\n        self.inner = inner\n    def read(self):\n        return f\"[{self.inner.read()}]\"\nsource = PlainText()\nprint(Brackets(source).read())","pythonNote":"This Python version relies on duck typing. C# explicitly checks the declared IText contract; neither needs a dependency-injection container.","trap":"Implements, inherits and receives are three different relationships. A constructor parameter alone never means is-a.","agentConnection":"Generated chat wrappers accept a client, add tracing or request behavior, and forward calls through a shared client contract.","questions":[{"id":"q06a","type":"choice","prompt":"Which statement correctly describes Brackets here?","options":[{"text":"Brackets inherits from inner.","why":"inner is a parameter naming an object, not a base class declaration."},{"text":"Brackets implements IText and receives an IText dependency.","why":"Correct. The colon states the contract; the constructor parameter receives another object satisfying it."},{"text":"Brackets creates a new IText interface instance.","why":"Interfaces are contracts. This constructor receives an already created implementation."}],"answer":1,"hint":"Read the parentheses and the colon separately.","explanation":"Brackets is usable as an IText and has an inner IText. Those are different relationships, joined by composition.","code":"interface IText { string Read(); }\nsealed class Brackets(IText inner) : IText\n{\n    public string Read() => $\"[{inner.Read()}]\";\n}"},{"id":"q06b","type":"choice","prompt":"What does this decorator pipeline print?","options":[{"text":"hello","why":"Both Brackets objects add behavior while forwarding; their output is not ignored."},{"text":"[hello]","why":"There are two nested wrappers, and each contributes one pair of brackets."},{"text":"[[hello]]","why":"Correct. The outer wrapper brackets the inner wrapper’s [hello] result."}],"answer":2,"hint":"Follow Read inward, then assemble its returned text outward.","explanation":"Each decorator calls its inner object once and wraps that result. This adds behavior without editing PlainText.","code":"IText text = new Brackets(new Brackets(new PlainText()));\nConsole.WriteLine(text.Read());\ninterface IText { string Read(); }\nsealed class PlainText : IText\n{\n    public string Read() => \"hello\";\n}\nsealed class Brackets(IText inner) : IText\n{\n    public string Read() => $\"[{inner.Read()}]\";\n}"},{"id":"q06c","type":"fill","prompt":"Fill one keyword to replace the inherited virtual method.","code":"class Greeting { public virtual string Say() => \"hello\"; }\nclass Friendly : Greeting\n{\n    public ___ string Say() => \"hi\";\n}","accepted":["override"],"hint":"This is the inheritance feature, not another method overload.","explanation":"override supplies the derived implementation. When an overridden virtual member is called, the runtime object type selects the implementation."},{"id":"q06d","type":"choice","prompt":"You only need to convert Celsius to Fahrenheit. Which starting design is simplest?","options":[{"text":"A function accepting a number and returning a number.","why":"Correct. No persistent object state or replaceable service is required by this task."},{"text":"A base class plus a subclass for every temperature.","why":"Individual numeric values do not require an inheritance hierarchy."},{"text":"An interface, factory and dependency container before writing the formula.","why":"Those tools can solve other needs, but this pure transformation does not need them."}],"answer":0,"hint":"Look for actual state or variation that would justify objects.","explanation":"Use the smallest structure that expresses the job: static double ToFahrenheit(double c) => c * 9 / 5 + 32. Add abstractions when a real need appears."}],"reference":[{"term":"Dependency injection without machinery","meaning":"new Brackets(new PlainText()) supplies a dependency through a constructor. A framework container may automate construction and lifetimes, but is not the definition of dependency injection."},{"term":"Base behavior","meaning":"class Friendly : Greeting { public override string Say() => base.Say() + \"!\"; } calls the base implementation, then adds behavior. The base method must permit overriding."},{"term":"abstract","meaning":"An abstract class cannot be instantiated directly. An abstract method declares a required implementation without a body; a concrete derived class must override it."},{"term":"Contract size","meaning":"Keep interfaces small and tied to actual substitution needs. A pure calculation usually fits a function; an object is useful for associated state or interchangeable behavior."}]},{"id":"07-collections","title":"Choose a container by its job","subtitle":"The generic type tells you what goes inside.","conceptIds":["generics","inference","extension-methods","initializers"],"rules":["List\u003cT> grows; T is the element type. Arrays have fixed length. Dictionary\u003cTKey,TValue> maps keys; HashSet\u003cT> keeps unique values.","IEnumerable\u003cT> promises enumeration, not stored contents. IReadOnlyList\u003cT> exposes indexing and Count without mutation methods through that interface.","A read-only interface does not freeze the underlying object or its elements. Another reference may still change them.","new() gets its type from context. [a, b] is a collection expression requiring a target type; new[] infers an array.","Extension methods are static methods callable with instance syntax. In a traditional declaration, this marks the first receiver parameter."],"code":"List\u003cstring> fruit = [\"pear\", \"plum\", \"pear\"];\nIReadOnlyList\u003cstring> view = fruit;\nHashSet\u003cstring> unique = new(fruit);\nDictionary\u003cstring, int> prices = new() { [\"pear\"] = 2 };\nfruit.Add(\"apple\");\nConsole.WriteLine(view.Count);\nConsole.WriteLine(unique.Count);\nConsole.WriteLine(prices[\"pear\"]);","python":"fruit = [\"pear\", \"plum\", \"pear\"]\nview = fruit\nunique = set(fruit)\nprices = {\"pear\": 2}\nfruit.append(\"apple\")\nprint(len(view))\nprint(len(unique))\nprint(prices[\"pear\"])","pythonNote":"The aliasing is similar. Python does not restrict view to IReadOnlyList operations; C# generic arguments are compiler-checked.","trap":"IReadOnlyList\u003cT> means this access path cannot mutate through that interface; it is not a deeply immutable snapshot.","agentConnection":"Stores expose collections of records, use dictionaries for lookup and sets for deduplication, and pass enumeration contracts to helpers.","questions":[{"id":"q07a","type":"choice","prompt":"Which type best expresses unique color names?","options":[{"text":"List\u003cstring>","why":"A list preserves elements including duplicates; uniqueness would need extra work."},{"text":"HashSet\u003cstring>","why":"Correct. A set enforces uniqueness according to its equality comparer."},{"text":"Dictionary\u003cint, int>","why":"That maps integers to integers; it does not express a set of text names."}],"answer":1,"hint":"The key requirement is uniqueness, not ordering or key-to-value lookup.","explanation":"HashSet\u003cstring> stores unique strings. Its comparer determines whether differently cased names count as equal."},{"id":"q07b","type":"choice","prompt":"What does this print?","options":[{"text":"1","why":"readOnly refers to the original list; it does not copy or freeze it."},{"text":"2","why":"Correct. The list changes through items, and the read-only interface observes the same object."},{"text":"Compilation fails at items.Add.","why":"items is still a List\u003cint>, so its mutation methods remain available."}],"answer":1,"hint":"There is only one list object in this example.","explanation":"IReadOnlyList hides mutation methods through that variable. It does not promise that every reference to the object is read-only.","code":"var items = new List\u003cint> { 1 };\nIReadOnlyList\u003cint> readOnly = items;\nitems.Add(2);\nConsole.WriteLine(readOnly.Count);"},{"id":"q07c","type":"fill","prompt":"Fill one keyword to declare a traditional extension method receiver.","code":"static class TextExtras\n{\n    public static string Twice(___ string text) => text + text;\n}","accepted":["this"],"hint":"The parameter is still passed to a static method, but can appear before the dot at the call site.","explanation":"this marks the receiver parameter. \"ha\".Twice() can be written as TextExtras.Twice(\"ha\"); the string class is not modified."},{"id":"q07d","type":"choice","prompt":"Which declaration gives [] the target type it needs?","options":[{"text":"var colors = [\"red\", \"blue\"];","why":"A collection expression has no standalone natural type for var to infer here."},{"text":"string[] colors = [\"red\", \"blue\"];","why":"Correct. The declared string[] supplies the target type for the collection expression."},{"text":"int[] colors = [\"red\", \"blue\"];","why":"The target element type int is incompatible with these string values."}],"answer":1,"hint":"The collection expression needs the destination collection type.","explanation":"Use string[] colors = [...], List\u003cstring> colors = [...], or var colors = new[] { ... }. The last form infers an array from new[]."}],"reference":[{"term":"Generic notation","meaning":"List\u003cstring> chooses string for the type parameter T. Dictionary\u003cstring, int> has two parameters: key type and value type. The angle brackets are type arguments, not comparisons."},{"term":"Lookup with TryGetValue","meaning":"if (prices.TryGetValue(\"pear\", out var price)) uses a value only when its key exists. Direct prices[\"missing\"] throws when the key is absent."},{"term":"Comparer choices","meaning":"new HashSet\u003cstring>(StringComparer.OrdinalIgnoreCase) treats \"Red\" and \"red\" as the same key. Choose this deliberately; default string comparison distinguishes them."},{"term":"Three bracket uses","meaning":"items[0] indexes; int[] items = [1, 2] creates a target-typed collection; items is [1, ..] tests a list pattern. Context changes the meaning of the same brackets."},{"term":"Inference shapes","meaning":"List\u003cint> values = new(); gets the construction type from the declaration. var values = new List\u003cint>(); gets the variable type from the construction. var values = []; lacks the required target type."}]},{"id":"08-linq","title":"A query is a recipe, not its results","subtitle":"Track when iteration actually happens.","conceptIds":["linq","lambdas","generics","extension-methods"],"rules":["Where filters; Any answers existence; Distinct removes duplicates; OrderByDescending sorts largest first. Comparers control equality or ordering where supplied.","FirstOrDefault returns the first item, or default(T): often null for references, zero for int. Default does not prove absence.","Many IEnumerable LINQ operations are deferred. foreach or a terminal operation executes the query; storing its variable does not cache results.","ToList and ToArray enumerate now and store a shallow snapshot. Re-enumerating a deferred query can repeat work and observe source changes.","Python generators also defer work, but a generator object is usually one-shot. A typical LINQ-to-Objects query can be enumerated again."],"code":"var sizes = new List\u003cint> { 1, 3, 3 };\nvar query = sizes.Where(size => size > 1).Distinct();\nvar snapshot = query.ToList();\nsizes.Add(4);\nConsole.WriteLine(string.Join(\",\", query.OrderByDescending(x => x)));\nConsole.WriteLine(string.Join(\",\", snapshot));\nConsole.WriteLine(query.Any());\nConsole.WriteLine(Array.Empty\u003cint>().FirstOrDefault());","python":"sizes = [1, 3, 3]\ndef query():\n    return dict.fromkeys(size for size in sizes if size > 1)\nsnapshot = list(query())\nsizes.append(4)\nprint(\",\".join(map(str, sorted(query(), reverse=True))))\nprint(\",\".join(map(str, snapshot)))\nprint(bool(query()))\nprint(next(iter([]), 0))","pythonNote":"The function creates a fresh query each call to mirror re-enumeration. A single stored Python generator would be consumed.","trap":"Deferred does not mean async or background execution. Sorting still needs to examine its input when the query is enumerated.","agentConnection":"Generated stores filter and rank local data with LINQ; materialization determines whether work repeats and which data version is observed.","questions":[{"id":"q08a","type":"choice","prompt":"What does the final line print?","options":[{"text":"1","why":"That was the count before the Add, but the deferred query was not stored as results then."},{"text":"2","why":"Correct. Count enumerates after 4 was added, so it finds 3 and 4."},{"text":"It fails because Where returns no collection.","why":"Where returns an enumerable query that Count can enumerate."}],"answer":1,"hint":"Find the operation that actually enumerates the query.","explanation":"Where stores the filtering recipe. Count executes it against the list as it exists at that time.","code":"var values = new List\u003cint> { 1, 3 };\nvar query = values.Where(x => x > 1);\nvalues.Add(4);\nConsole.WriteLine(query.Count());"},{"id":"q08b","type":"fill","prompt":"Fill the LINQ method name to execute now and store a List\u003cint>.","code":"var values = new List\u003cint> { 1, 3 };\nList\u003cint> saved = values.Where(x => x > 1).___();","accepted":["ToList"],"hint":"It names the collection type requested on the left.","explanation":"ToList enumerates immediately and returns a new List\u003cint>. Later structural changes to values do not change saved."},{"id":"q08c","type":"choice","prompt":"What does FirstOrDefault return here?","options":[{"text":"null","why":"The element type is int, whose default value is zero. int? would be a different element type."},{"text":"0","why":"Correct. default(int) is zero, so an empty integer sequence produces zero."},{"text":"It throws because the sequence is empty.","why":"First throws on an empty sequence; FirstOrDefault returns the default value."}],"answer":1,"hint":"The default comes from the element type, not the variable name.","explanation":"An empty int sequence and a sequence beginning with zero both produce zero here. Use an explicit presence check when that distinction matters.","code":"int[] empty = [];\nConsole.WriteLine(empty.FirstOrDefault());"},{"id":"q08d","type":"order","prompt":"Arrange the lines to take a snapshot before adding 4, then print snapshot size 1.","lines":["var values = new List\u003cint> { 1, 3 };","var saved = values.Where(x => x > 1).ToArray();","values.Add(4);","Console.WriteLine(saved.Length);"],"hint":"Materialize before changing the source, then inspect the saved array.","explanation":"ToArray stores the earlier result [3]. Adding to the original list later leaves this array’s length at one."}],"reference":[{"term":"Select projects","meaning":"values.Select(x => x * 2) transforms each element when enumerated. Where selects which elements remain; Select chooses each result’s shape."},{"term":"Any versus a count","meaning":"Any(predicate) stops after finding a match. Count(predicate) counts every match. Use Any when the question is only whether a match exists."},{"term":"Distinct with a comparer","meaning":"names.Distinct(StringComparer.OrdinalIgnoreCase) treats differently cased versions as duplicates. The default string comparer treats them as different."},{"term":"Source mutation and snapshots","meaning":"Changing a List before a later enumeration can change query results. Changing it while an active enumerator is traversing it may throw; a list is not a concurrent snapshot."},{"term":"Default is type-dependent","meaning":"FirstOrDefault() returns null for an empty string sequence but 0 for an empty int sequence. First() throws instead; modern overloads can also accept an explicit fallback."}]},{"id":"09-data","title":"Text, numbers and small checks","subtitle":"Choose the right representation before calculating or matching.","conceptIds":["strings","numbers","patterns","ranges-spans","regex-vs-patterns","weighted-aggregation"],"rules":["`int` and `long` are whole numbers; `double` uses binary floating point; `decimal` suits decimal arithmetic.","Integer division drops the fraction. Convert before dividing; combine totals before calculating a combined ratio.","`$\"Hi {name}\"` interpolates; `@\"a\\b\"` keeps backslashes; raw strings use three or more quotation marks.","`is` and `switch` patterns inspect values or shapes. Regular expressions inspect patterns inside text.","`values[^1]` means last. An array range copies elements; slicing a `Span\u003cT>` creates a view."],"code":"int doneA = 1, totalA = 2;\nint doneB = 9, totalB = 10;\ndecimal combined = (decimal)(doneA + doneB)\n    / (totalA + totalB);\nConsole.WriteLine(combined > 0.8m);","python":"done_a, total_a = 1, 2\ndone_b, total_b = 9, 10\ncombined = (done_a + done_b) / (total_a + total_b)\nprint(combined > 0.8)\n# Python / keeps a fraction; use Decimal for decimal arithmetic.","reference":[{"term":"Numbers","meaning":"`int`: 32-bit signed; `long`: 64-bit signed, e.g. `9L`. `0.5` is double; `0.5m` is decimal. Neither makes every fraction exact."},{"term":"DateOnly","meaning":"`new DateOnly(2026, 9, 8)` is a calendar date, with no time or timezone. Comparable to Python datetime.date."},{"term":"StringBuilder","meaning":"`new StringBuilder().Append(\"a\").Append(\"b\").ToString()` builds text through a mutable buffer; useful for repeated additions."},{"term":"Raw strings","meaning":"`\"\"\"{\"name\":\"Ava\"}\"\"\"` holds JSON text without escaping its internal quotes. Multiline raw strings use delimiter placement and indentation rules."},{"term":"Property and list patterns","meaning":"`name is { Length: > 0 }` checks a non-null value and its property. `items is [1, ..]` checks a list starting with 1."},{"term":"switch expression","meaning":"`count switch { 0 => \"none\", 1 => \"one\", _ => \"many\" }` selects a result; `_` is the fallback."},{"term":"Regex","meaning":"`Regex.IsMatch(text, @\"\\A\\d+\\z\")` checks that the entire text contains one or more digits. The regex library interprets this string."},{"term":"Ranges and spans","meaning":"`values[1..3]` includes indexes 1 and 2; the end is excluded. A mutable span view shares the original array storage."},{"term":"Weighted ratios","meaning":"Averaging 1/2 and 9/10 gives 0.7. Combined progress is 10/12, about 0.8333. Check for a zero denominator."},{"term":"enum","meaning":"`enum Size { Small, Large }` defines named constants in a distinct value type. Use `Size.Small`; an enum is not a string or a class instance."}],"trap":"Python integer / produces a fraction; C# int / int produces an integer. Casting the already-truncated answer is too late.","agentConnection":"The generated applications format text, match input shapes, parse dates and calculate evidence from totals using these ordinary operations.","questions":[{"id":"q09a","type":"choice","prompt":"What is printed?","options":[{"text":"2","why":"Correct: both operands are int, so division truncates the fraction."},{"text":"2.5","why":"That needs a decimal or floating-point operand, such as 5m / 2."},{"text":"A compiler error","why":"Integer division is legal; it just has different semantics from Python /."}],"answer":0,"hint":"Look at the operand types, not the variable name.","explanation":"C# calculates 5 / 2 using integer division. Use 5m / 2 or (decimal)5 / 2 for a decimal fraction.","code":"Console.WriteLine(5 / 2);"},{"id":"q09b","type":"fill","prompt":"Which one-character prefix inserts the value of name into this string?","accepted":["$"],"hint":"This is the C# counterpart of the prefix on a Python f-string.","explanation":"The $ prefix enables interpolation. Without it, braces are literal text. @ controls backslash handling instead.","code":"string name = \"Ava\";\nConsole.WriteLine(__\"Hi {name}\");"},{"id":"q09c","type":"choice","prompt":"Which value is printed after changing a copy and a view?","options":[{"text":"4","why":"The original second item starts as 4, but the span assignment changes it."},{"text":"8","why":"8 was assigned to the separate array copy."},{"text":"9","why":"Correct: the span shares storage with values, so view[0] changes values[1]."}],"answer":2,"hint":"The copy owns a new array; the span refers to the old array.","explanation":"An array range creates a shallow element copy. AsSpan creates a view. For int elements, editing the copy cannot change the original.","code":"int[] values = [2, 4, 6];\nint[] copy = values[1..];\nSpan\u003cint> view = values.AsSpan(1);\ncopy[0] = 8;\nview[0] = 9;\nConsole.WriteLine(values[1]);"},{"id":"q09d","type":"choice","prompt":"What do these two C# patterns print?","options":[{"text":"True, then True","why":"Correct: the list has two matching elements and the string has Length 4."},{"text":"False, then True","why":"The > 3 relational pattern matches 4, so the list test succeeds too."},{"text":"A regex error","why":"These are C# list/property patterns, not regex strings."}],"answer":0,"hint":"Square brackets here describe list shape; braces describe properties.","explanation":"[2, > 3] matches exactly two elements: 2 followed by a number greater than 3. { Length: 4 } checks a non-null object with that property value.","code":"int[] sizes = [2, 4];\nConsole.WriteLine(sizes is [2, > 3]);\nConsole.WriteLine(\"pear\" is { Length: 4 });"}]},{"id":"10-async","title":"A task is a promise of completion","subtitle":"Read asynchronous code without imagining a new thread for every call.","conceptIds":["async"],"rules":["`Task` tracks completion, failure or cancellation. `Task\u003cT>` also supplies a successful result of type T.","`async` enables `await`. Await obtains the result or propagates an exception; an incomplete await can suspend the method.","Calling a normal C# async method starts it immediately, until an incomplete await. A Python coroutine call behaves differently.","`Task.WhenAll` represents completion of every supplied task. It does not promise separate threads.","An already-completed task needs no suspension. Prefer await over blocking `.Result` or `.Wait()`."],"code":"Task\u003cint> pending = DoubleAsync(3);\nConsole.WriteLine(\"called\");\nConsole.WriteLine(await pending);\nstatic async Task\u003cint> DoubleAsync(int number)\n{\n    Console.WriteLine(\"entered\");\n    await Task.CompletedTask;\n    return number * 2;\n}","python":"import asyncio\n\nasync def double(number):\n    return number * 2\n\n# Inside async Python code:\npending = double(3)  # a coroutine; body has not started\nresult = await pending\n# asyncio.create_task(double(3)) schedules it to run.","reference":[{"term":"Execution order","meaning":"The example prints entered, called, 6. The call executes the method body; awaiting CompletedTask does not pause it."},{"term":"Concurrency","meaning":"Start independent operations, then await Task.WhenAll(a, b). Their waits may overlap. CPU parallelism requires separate consideration."},{"term":"WhenAll results","meaning":"For Task\u003cT> inputs, the resulting array follows input task order, even if operations finish in another order."},{"term":"Python comparison","meaning":"asyncio.gather waits for multiple awaitables. Python create_task schedules a coroutine; it does not synchronously run its body by default."},{"term":"Not every Task is hot","meaning":"Normal async APIs return already-started operations. An explicitly constructed new Task(...) can be unstarted; that is not the pattern taught here."},{"term":"ValueTask\u003cT>","meaning":"A value-type awaitable used by some library APIs: `int n = await ReadAsync();`. Consume each returned ValueTask once; it may avoid a Task allocation for synchronous completion, but is not a universal optimization."}],"trap":"A task is neither its eventual value nor a dedicated thread. Await can resume immediately when the task is complete.","agentConnection":"Agent request methods await model calls and tool work; they can suspend while waiting without creating one thread per request.","questions":[{"id":"q10a","type":"choice","prompt":"Which statement correctly describes Task\u003cint>?","options":[{"text":"It is always an int available immediately","why":"The result may not be available yet; the task also tracks failure or cancellation."},{"text":"It represents completion and can produce an int","why":"Correct: await obtains the int when the task completes successfully."},{"text":"It guarantees a separate worker thread","why":"A Task describes an operation, not a guaranteed thread."}],"answer":1,"hint":"Separate the container for completion from the successful value.","explanation":"Task\u003cint> describes an asynchronous operation with an int result. The task can also complete unsuccessfully."},{"id":"q10b","type":"fill","prompt":"Fill the keyword that obtains the int asynchronously.","accepted":["await"],"hint":"The successful value is inside Task\u003cint>.","explanation":"Await unwraps the successful result. If the task fails, await propagates its exception instead.","code":"Task\u003cint> pending = Task.FromResult(7);\nint number = __ pending;\nConsole.WriteLine(number);"},{"id":"q10c","type":"choice","prompt":"What is printed, and what does WhenAll guarantee?","options":[{"text":"2,5; both tasks have completed successfully","why":"Correct: the values follow the order supplied to WhenAll."},{"text":"5,2; the order is always reversed","why":"WhenAll returns results in input order, not reverse order."},{"text":"2,5; each operation has its own thread","why":"The output is right, but Task.WhenAll provides no thread-per-task guarantee."}],"answer":0,"hint":"The returned array follows input order.","explanation":"WhenAll waits for all supplied tasks. These example tasks are already completed; no background worker is needed.","code":"Task\u003cint> first = Task.FromResult(2);\nTask\u003cint> second = Task.FromResult(5);\nint[] values = await Task.WhenAll(first, second);\nConsole.WriteLine(string.Join(\",\", values));"},{"id":"q10d","type":"order","prompt":"Order these statements so each value exists before it is used.","lines":["Task\u003cint> pending = Task.FromResult(4);","int number = await pending;","Console.WriteLine(number * 2);"],"hint":"First create the task, then obtain its result, then use the result.","explanation":"The await depends on pending, and the output depends on number. This order prints 8."}]},{"id":"11-lifetimes","title":"Stop requests and clean up","subtitle":"Cancellation is cooperative; cleanup belongs to a clear scope.","conceptIds":["cancellation","exceptions","using"],"rules":["`CancellationTokenSource` requests cancellation; its token lets work observe that request.","`CancelAfter` requests cancellation after a deadline. Linked sources combine multiple cancellation requests.","Pass the token into cancellable operations or call `ThrowIfCancellationRequested`; cancellation does not forcibly kill work.","`using var` disposes at scope exit. `await using` awaits asynchronous disposal. Garbage collection serves a different purpose.","`catch` handles exceptions; `when` filters a catch. `finally` runs when leaving the try/catch construct, after any matching catch."],"code":"using var stop = new CancellationTokenSource();\nstop.Cancel();\ntry\n{\n    stop.Token.ThrowIfCancellationRequested();\n    Console.WriteLine(\"work\");\n}\ncatch (OperationCanceledException) when (stop.IsCancellationRequested)\n{\n    Console.WriteLine(\"cancelled\");\n}\nfinally { Console.WriteLine(\"cleanup\"); }","python":"try:\n    raise ValueError(\"stop this example\")\nexcept ValueError:\n    print(\"caught\")\nfinally:\n    print(\"cleanup\")\n# Python with / async with resemble scoped cleanup.\n# C# CancellationToken is not Python task.cancel().","reference":[{"term":"Linked cancellation","meaning":"`using var linked = CancellationTokenSource.CreateLinkedTokenSource(callerToken, deadlineToken);` creates a source cancelled when either input cancels."},{"term":"Deadline","meaning":"`stop.CancelAfter(TimeSpan.FromSeconds(5))` schedules a request. Work that ignores its token can continue beyond that time."},{"term":"Disposal versus memory","meaning":"Dispose releases resources or completes a scope promptly. The garbage collector later reclaims managed memory; using does not force collection."},{"term":"Async disposal","meaning":"`await using var resource = ...;` awaits DisposeAsync at scope exit; the resource must support asynchronous disposal."},{"term":"Exceptions across await","meaning":"A failing async method normally faults its task. Await rethrows the failure at the await expression; surrounding catch can handle it."},{"term":"Exception filters","meaning":"`catch (OperationCanceledException) when (token.IsCancellationRequested)` handles that type only if the condition is true. Otherwise the search continues."},{"term":"Rethrowing","meaning":"Inside catch, `throw;` rethrows while preserving the original exception stack. Do not catch errors merely to hide them."}],"trap":"Calling Cancel requests a stop; disposing a CancellationTokenSource cleans it up but does not itself request cancellation.","agentConnection":"Requests use deadlines and browser-disconnect tokens, while using/finally scopes close resources and tracing spans on success or failure.","questions":[{"id":"q11a","type":"choice","prompt":"You call stop.Cancel(), but a long loop never checks the token. What is guaranteed?","options":[{"text":"The loop ends immediately","why":"CancellationTokenSource does not forcibly interrupt arbitrary code."},{"text":"The cancellation request is recorded","why":"Correct: the loop must cooperate by observing the token or using a cancellable API."},{"text":"The entire process exits","why":"A cancellation request is not a process-termination command."}],"answer":1,"hint":"A token is a signal, not a kill switch.","explanation":"Cooperative work checks the token or passes it to operations that do. Without cooperation, the loop can continue."},{"id":"q11b","type":"choice","prompt":"What is the order of the three output lines?","options":[{"text":"body → disposed → after","why":"Correct: using disposes Marker when control leaves its enclosing block."},{"text":"disposed → body → after","why":"The resource is disposed after its use, not when created."},{"text":"body → after → disposed","why":"The inner block ends before after is printed, so disposal happens first."}],"answer":0,"hint":"Find the closing brace of the scope containing using var.","explanation":"The compiler arranges disposal at scope exit, including normal exception unwinding. This does not depend on garbage collection.","code":"{\n    using var item = new Marker();\n    Console.WriteLine(\"body\");\n}\nConsole.WriteLine(\"after\");\nsealed class Marker : IDisposable\n{\n    public void Dispose() => Console.WriteLine(\"disposed\");\n}"},{"id":"q11c","type":"fill","prompt":"Fill the method name that schedules a cancellation request after five seconds.","accepted":["CancelAfter"],"hint":"This sets a deadline on the source; it does not sleep here.","explanation":"CancelAfter schedules cancellation. Passing stop.Token into work is still necessary for that work to observe it.","code":"using var stop = new CancellationTokenSource();\nstop.__(TimeSpan.FromSeconds(5));"},{"id":"q11d","type":"choice","prompt":"What is printed when this task fails?","options":[{"text":"success → finished","why":"Await propagates the failure, so execution skips the success line."},{"text":"caught → finished","why":"Correct: await throws the task failure into catch, then finally runs."},{"text":"Nothing; Task failures cannot be caught","why":"Await makes failures observable through ordinary try/catch."}],"answer":1,"hint":"Follow the exception at the await expression.","explanation":"The faulted task throws InvalidOperationException when awaited. The matching catch handles it; finally runs afterward.","code":"try\n{\n    await Task.FromException(new InvalidOperationException());\n    Console.WriteLine(\"success\");\n}\ncatch (InvalidOperationException) { Console.WriteLine(\"caught\"); }\nfinally { Console.WriteLine(\"finished\"); }"}]},{"id":"12-streams","title":"One value at a time","subtitle":"A sequence can do work when you ask for the next value.","conceptIds":["streams","async-stream-cancellation","linq"],"rules":["An `IEnumerable\u003cT>` iterator uses `yield return`; its body runs during enumeration, not when the iterator is obtained.","`IAsyncEnumerable\u003cT>` allows waiting between elements. Consume it with `await foreach`.","`WithCancellation(token)` supplies an enumeration token; `[EnumeratorCancellation]` connects it to an async iterator parameter.","`ConfigureAwait(false)` avoids requesting the captured context. It does not choose or create a background thread.","`foreach` and `await foreach` dispose supported enumerators when their loops exit, including early break."],"code":"await foreach (int number in CountAsync())\n    Console.WriteLine(number);\nstatic async IAsyncEnumerable\u003cint> CountAsync()\n{\n    yield return 1;\n    await Task.CompletedTask;\n    yield return 2;\n}","python":"import asyncio\n\nasync def count():\n    yield 1\n    await asyncio.sleep(0)\n    yield 2\n\n# Inside async Python code:\n# async for number in count():\n#     print(number)","reference":[{"term":"Async iterator timing","meaning":"Calling an async iterator obtains a sequence without executing its body. Enumeration drives that body, unlike a normal async Task method."},{"term":"Lazy is not cached","meaning":"An iterator may rerun its body on each enumeration. Storing IEnumerable\u003cT> does not materialize its results."},{"term":"Incremental versus complete","meaning":"A stream can deliver values as they become available. A Task\u003cList\u003cT>> produces a complete list before the caller receives its result."},{"term":"Cooperative async iterator","meaning":"Use `async IAsyncEnumerable\u003cint> Read([EnumeratorCancellation] CancellationToken token = default)`. Check token or pass it to awaited work."},{"term":"Consumer token","meaning":"`await foreach (var x in Read().WithCancellation(token))` passes the token to enumeration. The producer must consume it."},{"term":"ConfigureAwait","meaning":"`await operation.ConfigureAwait(false)` controls continuation-context capture for that await. ASP.NET Core normally has no custom synchronization context."},{"term":"Breaking an async loop","meaning":"The loop awaits asynchronous enumerator disposal. A producer finally block can run then. This does not finish producing remaining values."}],"trap":"An async iterator does not make the HTTP response streaming by itself. The server and browser must also exchange and consume chunks.","agentConnection":"Model updates and browser NDJSON can be consumed incrementally; other routes collect the stream before returning one complete response.","questions":[{"id":"q12a","type":"choice","prompt":"Which line appears first?","options":[{"text":"started","why":"Calling an iterator creates the enumerable; it does not run its iterator body yet."},{"text":"made query","why":"Correct: enumeration begins only at foreach."},{"text":"1","why":"The body prints started before yielding its first value."}],"answer":1,"hint":"Find the first statement that asks the sequence for an element.","explanation":"The full output is made query, started, 1. IEnumerable describes a sequence; enumeration performs the work.","code":"IEnumerable\u003cint> numbers = Count();\nConsole.WriteLine(\"made query\");\nforeach (int number in numbers) Console.WriteLine(number);\nstatic IEnumerable\u003cint> Count()\n{\n    Console.WriteLine(\"started\");\n    yield return 1;\n}"},{"id":"q12b","type":"fill","prompt":"Which keyword completes a loop over an IAsyncEnumerable\u003cint>?","accepted":["await"],"hint":"The next value may require an asynchronous wait.","explanation":"await foreach can await each move to the next value and asynchronously dispose the enumerator when the loop exits.","code":"__ foreach (int number in CountAsync())\n    Console.WriteLine(number);"},{"id":"q12c","type":"choice","prompt":"What is printed when the consumer breaks after one value?","options":[{"text":"1 → 2 → closed","why":"break stops consumption; the producer does not continue to yield 2."},{"text":"1 only","why":"The async iterator is disposed, so its finally block also runs."},{"text":"1 → closed","why":"Correct: early exit disposes the enumerator and executes its cleanup."}],"answer":2,"hint":"A loop still performs enumerator cleanup when break exits it.","explanation":"The consumer sees 1, then breaks. await foreach disposes the async iterator, which executes finally without yielding 2.","code":"await foreach (int number in CountAsync())\n{\n    Console.WriteLine(number);\n    break;\n}\nstatic async IAsyncEnumerable\u003cint> CountAsync()\n{\n    try { await Task.CompletedTask; yield return 1; yield return 2; }\n    finally { Console.WriteLine(\"closed\"); }\n}"},{"id":"q12d","type":"choice","prompt":"What does ConfigureAwait(false) mean?","options":[{"text":"Always resume on a new background thread","why":"It does not promise any specific thread or create one."},{"text":"Do not request resumption on the captured context","why":"Correct: it controls context capture, not the existence of a background worker."},{"text":"Ignore cancellation and errors","why":"Cancellation and exceptions still propagate through await."}],"answer":1,"hint":"It configures the await continuation, not the operation result.","explanation":"ConfigureAwait(false) avoids requesting the captured context. If the awaitable is already complete, execution may simply continue synchronously."}]},{"id":"13-files-config","title":"Project files, paths and settings","subtitle":"Distinguish compilation, runtime files, and values chosen at startup.","conceptIds":["paths","namespaces","using","configuration","build"],"rules":["Namespaces group type names. `using System.Text;` imports names for lookup; it does not create objects or dispose resources.","`Path.Combine` joins path parts. `AppContext.BaseDirectory` locates the application base, which can differ from the working directory.","The `.csproj` declares target framework, packages and copied content. NuGet supplies packages; using directives do not install them.","`IConfiguration` reads settings through providers. For the same key, the provider added later takes precedence.","Inspect the actual provider order. Keep credentials separate from ordinary settings, committed sample files and printed output."],"code":"using Microsoft.Extensions.Configuration;\nvar first = new Dictionary\u003cstring, string?> { [\"Color\"] = \"blue\" };\nvar later = new Dictionary\u003cstring, string?> { [\"Color\"] = \"green\" };\nIConfiguration config = new ConfigurationBuilder()\n    .AddInMemoryCollection(first)\n    .AddInMemoryCollection(later)\n    .Build();\nConsole.WriteLine(config[\"Color\"]);","python":"first = {\"Color\": \"blue\"}\nlater = {\"Color\": \"green\"}\nconfig = {**first, **later}\nprint(config[\"Color\"])\n# Analogy: later values replace matching earlier keys.\n# .NET providers are richer than this dictionary merge.","reference":[{"term":"SDK → build → run","meaning":"The SDK includes compiler and build tools. `dotnet build` compiles the project; `dotnet run` builds as needed and starts it."},{"term":"Runtime and ASP.NET Core","meaning":".NET runs compiled C# code. ASP.NET Core adds web hosting, HTTP routes and middleware; they are framework capabilities."},{"term":"PackageReference","meaning":"A `.csproj` PackageReference names a NuGet dependency and version. Restore resolves it; a namespace import only shortens source names."},{"term":"Content copying","meaning":"Inside ItemGroup, `\u003cNone Update=\"Data/*.json\" CopyToOutputDirectory=\"PreserveNewest\" />` copies matching existing project items into build output."},{"term":"Publish separately","meaning":"Use CopyToPublishDirectory when content must be included in published output. Verify deployed paths; build output and publishing are different stages."},{"term":"Runtime paths","meaning":"`Path.Combine(AppContext.BaseDirectory, \"Data\", \"colors.json\")` locates deployed content without assuming the shell started in the project folder."},{"term":"Settings sources","meaning":"Providers may read JSON, environment variables, command-line arguments or other sources. Framework defaults and explicit Add... calls determine order."},{"term":"Namespaces versus folders","meaning":"`namespace Learning;` assigns type names to a namespace. Folder names are a convention and do not automatically define namespaces."},{"term":"Example context","meaning":"The example uses Microsoft.Extensions.Configuration from the ASP.NET Core shared framework; it reads only in-memory dictionaries."}],"trap":"Changing your current working directory can break relative file paths. Merely putting a data file beside source does not guarantee deployment.","agentConnection":"Generated apps copy their local data into output, resolve it at startup and load model/observability configuration through explicit provider calls.","questions":[{"id":"q13a","type":"choice","prompt":"Why does this configuration return green for Color?","options":[{"text":"The environment always wins","why":"The example has no environment provider, and precedence is determined by actual provider order."},{"text":"The later provider supplies the same key","why":"Correct: the green provider was added after the blue provider."},{"text":"Alphabetically later color names win","why":"Configuration compares keys, not alphabetic order of values."}],"answer":1,"hint":"Read the order of AddInMemoryCollection calls.","explanation":"Later-added providers override earlier values for the same key. There is no universal rule that a particular source always wins.","code":"using Microsoft.Extensions.Configuration;\nvar first = new Dictionary\u003cstring, string?> { [\"Color\"] = \"blue\" };\nvar later = new Dictionary\u003cstring, string?> { [\"Color\"] = \"green\" };\nIConfiguration config = new ConfigurationBuilder()\n    .AddInMemoryCollection(first)\n    .AddInMemoryCollection(later)\n    .Build();\nConsole.WriteLine(config[\"Color\"]);"},{"id":"q13b","type":"fill","prompt":"Fill the property for a path relative to the application base, independent of the shell working directory.","accepted":["BaseDirectory"],"hint":"This is a property of AppContext.","explanation":"AppContext.BaseDirectory identifies the application base. Path.Combine joins it with portable path segments; the file still must be deployed.","code":"string path = Path.Combine(AppContext.__, \"Data\", \"colors.json\");"},{"id":"q13c","type":"choice","prompt":"What does using System.Text; do?","options":[{"text":"Downloads a NuGet package","why":"Package references and restore handle dependencies, not using directives."},{"text":"Imports a namespace for shorter type names","why":"Correct: you can write StringBuilder instead of System.Text.StringBuilder."},{"text":"Disposes all strings at scope exit","why":"That confuses a namespace using directive with a using resource declaration."}],"answer":1,"hint":"Compare using System.Text; with using var resource = ...;.","explanation":"The same keyword has distinct roles. A using directive controls name lookup; a using declaration schedules resource disposal."},{"id":"q13d","type":"order","prompt":"Order the minimum workflow for building and running a C# project from source.","lines":["Declare project target and dependencies in the .csproj.","Restore dependencies and compile the source with dotnet build.","Execute the compiled application with the .NET runtime."],"hint":"The build needs project information; execution needs compiled output.","explanation":"dotnet build normally includes restore. dotnet run can perform the build stage for you, then launch the result; these are still different stages."}]},{"id":"14-json","title":"Objects cross the JSON boundary","subtitle":"A typed shape helps you read data; validation decides whether to accept it.","conceptIds":["json","attributes","source-generation","generation-vs-mirroring"],"rules":["`Serialize` turns an object into JSON text; `Deserialize\u003cT>` attempts to build a T from JSON.","A DTO is a data-transfer shape, often a record. It is not automatically a complete validation policy.","Nullable annotations guide compiler analysis. Runtime input still needs explicit checks and appropriate serializer options.","Attributes attach metadata. Reflection lets code inspect types, methods and metadata; libraries decide how to use it.","JSON source generation creates serializer support during compilation. `partial` lets generated and handwritten declarations form one type."],"code":"using System.Text.Json;\nstring json = \"\"\"{\"Name\":\"Mira\",\"Age\":7}\"\"\";\nPerson? person = JsonSerializer.Deserialize\u003cPerson>(json);\nif (person is null || string.IsNullOrWhiteSpace(person.Name)\n    || person.Age \u003c 0)\n    throw new ArgumentException(\"Invalid person\");\nConsole.WriteLine(person.Name);\nrecord Person(string Name, int Age);","python":"import json\n\nperson = json.loads('{\"Name\":\"Mira\",\"Age\":7}')\nif not person.get(\"Name\") or person[\"Age\"] \u003c 0:\n    raise ValueError(\"Invalid person\")\nprint(person[\"Name\"])\n# Python returns a dictionary here, not a typed C# record.","reference":[{"term":"Serialization","meaning":"`JsonSerializer.Serialize(new Person(\"Mira\", 7))` creates JSON text. Property naming and enum handling depend on configured options."},{"term":"Nullable enforcement","meaning":"System.Text.Json can opt into limited RespectNullableAnnotations checks. That still does not validate every missing value or business rule."},{"term":"Attributes","meaning":"`[Description(\"Counts beads\")]` describes a method. It cannot execute the method, validate its arguments or expose it as a tool by itself."},{"term":"Reflection","meaning":"`typeof(Counter).GetMethods()` inspects method metadata at runtime. A library may use it to build tool descriptions or invoke registered methods."},{"term":"Source-generated JSON","meaning":"`[JsonSerializable(typeof(Person))] partial class PeopleJson : JsonSerializerContext { }` requests generated JSON metadata/support."},{"term":"Actually using the context","meaning":"Pass `PeopleJson.Default.Person` to the appropriate JsonSerializer overload. Declaring a context alone does not redirect every serializer call."},{"term":"Two meanings of generated","meaning":"The C# compiler can generate serializer source. A packaging script can copy skill files. These are separate operations with different owners."}],"trap":"A property declared string can still receive invalid external data. Types, serializer settings and application validation each do different jobs.","agentConnection":"Browser DTOs and model tool arguments cross JSON boundaries; attributes describe tools and generated serializer contexts support selected data types.","questions":[{"id":"q14a","type":"choice","prompt":"A method has [Description(\"Adds two numbers\")]. What does the attribute do by itself?","options":[{"text":"Attaches descriptive metadata","why":"Correct: another piece of code must inspect or use that metadata."},{"text":"Automatically registers a model tool","why":"Tool exposure requires explicit framework or application registration."},{"text":"Rejects all invalid arguments","why":"DescriptionAttribute is descriptive, not an argument-validation rule."}],"answer":0,"hint":"An attribute is information attached to a declaration.","explanation":"Libraries can read Description metadata when constructing tool definitions. The C# attribute alone neither runs the method nor validates its input."},{"id":"q14b","type":"choice","prompt":"What is printed when the JSON value itself is null?","options":[{"text":"True","why":"Correct: deserializing JSON null into this reference type produces a null reference."},{"text":"False","why":"A DTO declaration does not force the JSON value to contain an object."},{"text":"The name of the record","why":"No Person object with a name is created from JSON null."}],"answer":0,"hint":"The input is the JSON null value, not an empty object.","explanation":"Deserialize\u003cPerson> can return null. Checking the result remains necessary before accessing members.","code":"Person? person = JsonSerializer.Deserialize\u003cPerson>(\"null\");\nConsole.WriteLine(person is null);\nrecord Person(string Name);"},{"id":"q14c","type":"order","prompt":"Order this safe input path before using a value supplied from outside.","lines":["Parse JSON into the expected DTO shape.","Validate presence, allowed values and domain constraints.","Use the validated data in the operation."],"hint":"Parsing tells you the shape; validation determines acceptance.","explanation":"A successfully parsed object can still have invalid contents. Validation belongs before the operation that relies on those contents."},{"id":"q14d","type":"fill","prompt":"Which modifier allows a generator to contribute the rest of this context type?","accepted":["partial"],"hint":"The declaration is one part of the final type.","explanation":"partial declarations combine at compilation. The JSON generator supplies additional implementation for the same type; this is not file-copy packaging.","code":"[JsonSerializable(typeof(Person))]\n__ class PeopleJson : JsonSerializerContext { }"}]},{"id":"15-web","title":"The browser talks HTTP","subtitle":"Separate browser JavaScript, server C#, and the format on the wire.","conceptIds":["minimal-api","browser-server-boundary","processes"],"rules":["ASP.NET Core maps HTTP routes to handlers. Binding turns request values into handler arguments.","Validate input before acting. `Results.Ok` creates a 200 response; `Results.BadRequest` creates a 400 response.","Middleware surrounds request handling and can continue to the next step or return a response early.","Browser JavaScript uses fetch to send HTTP requests. The browser does not directly call an ordinary C# method.","A process can serve many requests. Session state spans requests only when the application deliberately stores and identifies it."],"code":"// ASP.NET Core: register a route; this excerpt starts no server.\nvar builder = WebApplication.CreateBuilder();\nvar app = builder.Build();\napp.MapGet(\"/square/{value:int}\", (int value) =>\n{\n    if (value \u003c 0 || value > 100)\n        return Results.BadRequest(new { error = \"Use 0 to 100\" });\n    return Results.Ok(new { answer = value * value });\n});","python":"# Analogy inside a Python web framework:\n# @app.get(\"/square/{value}\")\n# def square(value: int):\n#     ...validate value...\n#     return {\"answer\": value * value}\n# Routing and HTTP responses come from the framework,\n# not Python or C# syntax alone.","reference":[{"term":"Binding","meani

name: check-copilot-instructions

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "references/mcp.md"
      - "skills/**"
      - "scripts/build_copilot.py"
      - "scripts/tests/**"
      - "commands/build-custom-agent.md"
      - "commands/build-template-agent.md"
      - "copilot/.github/prompts/build-custom-agent.prompt.md"
      - "copilot/.github/prompts/build-template-agent.prompt.md"
      - "scripts/sync_skill_refs.py"
      - "scripts/copilot-instructions.template.md"
      - "copilot/.github/copilot-instructions.md"
      - "copilot/skills/build-template-agent/**"
      - "copilot/skills/build-custom-agent/**"
      - ".github/workflows/check-copilot.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify copilot-instructions.md is in sync
        run: python scripts/build_copilot.py --check
      - name: Verify skill MCP references are in sync
        run: python scripts/sync_skill_refs.py --check
      - name: Test Copilot payload mirroring
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Build every ready template and test domain behavior (no credentials)
        run: |
          for project in skills/build-template-agent/assets/*/*.csproj; do
            dotnet build "$project" --configuration Release
          done
          for project in scripts/tests/template_runtime/*/*.csproj; do
            dotnet run --project "$project" --configuration Release
          done
      - name: Test template UI state (no browser or credentials)
        run: |
          for script in scripts/tests/template_runtime/*/ui-state.test.mjs; do
            node "$script"
          done
      - name: Test the custom-agent helpers
        run: dotnet run --file scripts/tests/custom-agent/helper-tests.cs
      - name: Test custom-agent history and retrieval
        run: dotnet run --project scripts/tests/custom-agent/runtime/RuntimeTests.csproj
      - name: Copy, validate, and build the custom-agent starter
        run: |
          custom_agent_target="$RUNNER_TEMP/custom-agent-starter"
          dotnet run --file skills/build-custom-agent/scripts/copy-template.cs -- --target "$custom_agent_target"
          dotnet run --file skills/build-custom-agent/scripts/validate-project.cs -- --target "$custom_agent_target"
          dotnet build "$custom_agent_target/CustomAgent.csproj" --configuration Release
      - name: Verify .NET whitespace formatting
        run: |
          for project in skills/build-template-agent/assets/*/*.csproj skills/build-custom-agent/assets/custom-agent-starter/*.csproj scripts/tests/template_runtime/*/*.csproj scripts/tests/custom-agent/runtime/*.csproj; do
            dotnet format "$project" whitespace --verify-no-changes --no-restore
          done
